name: Build and Push Docker Images

on:
  push:
    branches:
      - main  # 当代码推送到 main 分支时自动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 设置 Docker Buildx (支持多架构编译)
        uses: docker/setup-buildx-action@v3

      - name: 获取当前时间作为版本号
        id: vars
        run: echo "VERSION_TAG=v$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: 构建并推送 Backend (amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            evekgolden/novelforge-backend:latest
            evekgolden/novelforge-backend:${{ env.VERSION_TAG }}

      - name: 构建并推送 Frontend (amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            evekgolden/novelforge-frontend:latest
            evekgolden/novelforge-frontend:${{ env.VERSION_TAG }}
