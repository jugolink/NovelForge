server {
    listen 80;
    server_name localhost;

    # Use Docker's internal DNS resolver to avoid caching stale IPs if the backend restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Handle SPA routing (fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the backend container
    location /api/ {
        # Use a variable to force dynamic DNS resolution
        set $backend "http://novelforge-backend:20489";
        proxy_pass $backend;
        
        # Intercept 307 redirects from FastAPI (e.g., missing trailing slash)
        # and rewrite them to relative URLs to prevent Mixed Content or internal DNS leakage
        proxy_redirect http://$http_host/ /;
        proxy_redirect https://$http_host/ /;
        proxy_redirect http://novelforge-backend:20489/ /;
        
        # VERY IMPORTANT: Prevent Nginx from converting the relative URL back to an absolute HTTP URL
        absolute_redirect off;

        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        
        # Disable buffering for SSE (Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy /imgs requests to the backend container
    location /imgs/ {
        set $backend "http://novelforge-backend:20489";
        proxy_pass $backend;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
