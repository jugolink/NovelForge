
services:
  backend:
    image: evekgolden/novelforge-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novelforge-backend
    volumes:
      - ./data:/app/data
    environment:
      - NOVELFORGE_DB_PATH=/app/data/novelforge.db
    restart: unless-stopped
    # 💡 打上允许更新标签（全局 Watchtower 扫描到该标签才会自动拉取更新）
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: evekgolden/novelforge-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novelforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
