
services:
  backend:
    image: evekgolden/novelforge-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novelforge-backend
    volumes:
      - novelforge-data:/app/data
    environment:
      - NOVELFORGE_DB_PATH=/app/data/novelforge.db
    restart: unless-stopped

  frontend:
    image: evekgolden/novelforge-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novelforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.41
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # 每 24 小时检查一次前后端容器，并自动清理旧镜像
    command: --interval 86400 --cleanup novelforge-backend novelforge-frontend

volumes:
  novelforge-data:
